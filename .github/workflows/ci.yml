name: Build and integration
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sofia_test
          POSTGRES_USER: sofia
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sofia -d sofia_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven, cache-dependency-path: backend/pom.xml}
      - run: mvn -B verify
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/sofia_test
          DB_PASSWORD: ci-only-password
          OPERATOR_PASSWORD: ci-operator-password
          QUALITY_PASSWORD: ci-quality-password
          READER_PASSWORD: ci-reader-password
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci && npm run build
        working-directory: frontend
